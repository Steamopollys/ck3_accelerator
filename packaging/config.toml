# CK3 Accelerator configuration (release defaults).
# Sits next to ck3accel_core.dll in the CK3 binaries folder.

[core]
# trace, debug, info, warn, error, critical
log_level = "info"

# Load on CK3 builds we haven't specifically tested (one-time warning still fires).
# On for release so a minor game update doesn't silently switch the accelerator off.
allow_untested_versions = true

# Panic hotkey: disables every hook and falls back to stock CK3, no restart. Ctrl/Shift/Alt
# + one of F1..F24 / A..Z / 0..9.
kill_switch = "Ctrl+Shift+F12"

# Local-only perf metrics to logs/metrics.csv. Never sent anywhere. Off by default.
telemetry = false

# Live log console window. Handy for a first launch to confirm things loaded; off by default.
console = false

[plugins]
# The three optimizations, on out of the box. All single-player + Ironman, checksum-neutral.
accel_family_lists = true    # O(N) family-list dedup
accel_family_cache = true    # per-frame family-list cache (needs family_cache.conf)
accel_tick_cache   = true    # in-tick pure-trigger cache (needs tick_cache.conf)

# Off: near-zero benefit (save decompression is ~4% of load, 0 on uncompressed saves).
accel_save_load = false
